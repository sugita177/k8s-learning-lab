apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-case-4-deploy
  namespace: k8s-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-case4
  template:
    metadata:
      labels:
        app: web-case4
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-case-4-svc
  namespace: k8s-lab
spec:
  type: ClusterIP
  selector:
    app: web-case-4
  ports:
    - port: 80
      targetPort: 80
