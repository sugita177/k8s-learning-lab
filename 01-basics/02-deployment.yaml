apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: k8s-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
        - name: nginx-container
          image: nginx:1.27
          ports:
            - containerPort: 80
          # --- ① 環境変数の注入 (ConfigMap & Secret) ---
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: web-html-config
                  key: APP_ENV
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: web-api-secret
                  key: API_KEY
          # --- ② ファイルマウント (ConfigMap -> index.html) ---
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html-volume
          configMap:
            name: web-html-config
