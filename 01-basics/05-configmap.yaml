apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html-config
  namespace: k8s-lab
data:
  APP_ENV: "production"
  LOG_LEVEL: "info"
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Kubernetes Lab Step 1-5</title>
      <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f0f8ff; }
        h1 { color: #0066cc; }
      </style>
    </head>
    <body>
      <h1>🎉 Hello from ConfigMap!</h1>
      <p>Nginx の標準画面から、ConfigMap の HTML に見事に差し替わりました！</p>
    </body>
    </html>
