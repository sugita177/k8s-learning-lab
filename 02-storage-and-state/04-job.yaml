apiVersion: batch/v1
kind: Job
metadata:
  name: my-first-job
  namespace: k8s-lab
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: batch-worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - "echo 'バッチ処理を開始します...'; sleep 5; echo '処理が正常完了しました！'"
