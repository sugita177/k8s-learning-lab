apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: k8s-lab
spec:
  clusterIP: None # Headless Service（固定VIPを持たない）
  selector:
    app: web-stateful
  ports:
    - port: 80
      name: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-stateful
  namespace: k8s-lab
spec:
  serviceName: "web-headless"
  replicas: 3
  selector:
    matchLabels:
      app: web-stateful
  template:
    metadata:
      labels:
        app: web-stateful
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
              name: web
          volumeMounts:
            - name: www-data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: www-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
